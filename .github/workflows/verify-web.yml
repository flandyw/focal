name: verify web

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "server/**"
      - "api/**"
      - "tsconfig*.json"
      - "index.html"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-web.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "server/**"
      - "api/**"
      - "tsconfig*.json"
      - "index.html"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-web.yml"

concurrency:
  group: verify-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

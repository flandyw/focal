name: publish

on:
  push:
    tags:
      - "app-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_EXAMTRACK_URL: https://vcetracker.vercel.app/
  VITE_EXAMTRACK_SUPABASE_URL: ${{ secrets.VITE_EXAMTRACK_SUPABASE_URL }}
  VITE_EXAMTRACK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_EXAMTRACK_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:chatgpt-sidecar
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag and create release
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "app-v$version"
          for attempt in 1 2 3 4; do
            if gh release create "$GITHUB_REF_NAME" --verify-tag --title "Focal v$version" --notes "See the assets to download this version and install."; then exit 0; fi
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((60 * 2 ** (attempt - 1)))
          done

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Focal v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true

  publish-android:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FOCAL_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      FOCAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure signing
        run: |
          test -n "$FOCAL_SUPABASE_URL" && test -n "$FOCAL_SUPABASE_PUBLISHABLE_KEY"
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focal-release.jks"
          chmod 600 "$RUNNER_TEMP/focal-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/focal-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android-native
        run: bash ./gradlew :app:assembleRelease --no-daemon
      - name: Verify and prepare release assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-native/app/build/outputs/apk/release/app-release.apk
          node android-native/scripts/release-manifest.mjs --self-check
          mkdir -p "$RUNNER_TEMP/android-release"
          node android-native/scripts/release-manifest.mjs \
            android-native/app/build/outputs/apk/release/app-release.apk \
            android-native/app/build/outputs/apk/release/output-metadata.json \
            package.json "$RUNNER_TEMP/android-release" "$GITHUB_REF_NAME"
      - name: Upload Android assets
        run: |
          for attempt in 1 2 3 4; do
            if gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/android-release/Focal-Android.apk" "$RUNNER_TEMP/android-release/android-update.json" --clobber; then exit 0; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((60 * 2 ** (attempt - 1)))
          done

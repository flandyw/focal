name: verify desktop

# One workflow per app so a web-only change never installs Rust and Tauri system
# libraries. If a branch protection rule requires the old "check" job, name these
# "check (desktop)" / "check (web)" / "check (android)" or update the required list.
on:
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/verify-desktop.yml"
      - "!web/**"
      - "!android-native/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"
      - "Makefile"
      - ".github/workflows/verify-desktop.yml"
      - "!web/**"
      - "!android-native/**"

concurrency:
  group: verify-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_EXAMTRACK_URL: https://vcetracker.vercel.app/

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:chatgpt-sidecar
      # ponytail: `check` already typechecked this checkout; build only the bundle.
      - run: bunx --no-install vite build

<!-- Source for apple-touch-icon.png. Full-bleed and opaque: iOS applies its own rounded mask,
     so the art must not carry corners, an inset frame, or transparency. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2A3C"/>
      <stop offset=".55" stop-color="#0C141E"/>
      <stop offset="1" stop-color="#060A10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 560) scale(560)">
      <stop stop-color="#2F6BFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rear" x1="232" y1="188" x2="612" y2="728" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DB5DA"/>
      <stop offset="1" stop-color="#4A6690"/>
    </linearGradient>
    <linearGradient id="front" x1="402" y1="288" x2="792" y2="838" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AA8FF"/>
      <stop offset=".5" stop-color="#2A72F6"/>
      <stop offset="1" stop-color="#1550D4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000814" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="rotate(-10 422 458)" filter="url(#shadow)">
    <rect x="232" y="188" width="380" height="540" rx="76" fill="url(#rear)"/>
    <rect x="232" y="188" width="380" height="200" rx="76" fill="url(#sheen)" opacity=".6"/>
  </g>
  <g transform="rotate(-4 597 563)" filter="url(#shadow)">
    <rect x="402" y="288" width="390" height="550" rx="78" fill="url(#front)"/>
    <rect x="402" y="288" width="390" height="210" rx="78" fill="url(#sheen)"/>
    <circle cx="718" cy="364" r="24" fill="#FFFFFF"/>
  </g>
</svg>

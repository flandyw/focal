name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_EXAMTRACK_URL: https://vcetracker.vercel.app/
  VITE_EXAMTRACK_SUPABASE_URL: ${{ secrets.VITE_EXAMTRACK_SUPABASE_URL }}
  VITE_EXAMTRACK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_EXAMTRACK_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:logic
      - run: bun run build:chatgpt-sidecar
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bun run build

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: node android-native/scripts/release-manifest.mjs --self-check
      - name: Build native Android app
        working-directory: android-native
        run: bash ./gradlew :app:assembleDebug --no-daemon
